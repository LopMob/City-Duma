# Настройки поиска секретов (ЛР5, п.12): gitleaks, job secrets / make secrets.
# Файл критический (CODEOWNERS): ослабить поиск без одобрения владельца нельзя.
#
# Используются ВСЕ стандартные правила gitleaks (токены GitHub/GitLab, ключи
# облаков, приватные ключи, JWT и т.д.) и правила проекта ниже.
#
# Ложное срабатывание НЕ исключается правкой этого файла «на всякий случай»:
# в .gitleaksignore добавляется отпечаток (Fingerprint из отчёта) конкретной
# находки с комментарием-обоснованием — это тоже видно и согласуется в MR.
# Настоящий утёкший секрет удалением из истории не «лечится»: его отзывают.

title = "City-Duma gitleaks config"

[extend]
useDefault = true

# Пароль, вписанный прямо в строку подключения PostgreSQL. В репозитории
# допустимы только шаблоны из *.example и тестовые заглушки «postgres:postgres».
[[rules]]
id = "postgres-url-password"
description = "Пароль в строке подключения PostgreSQL"
regex = '''postgres(?:ql)?(?:\+psycopg2)?://[^:\s/]+:([^@\s/$'"{}]{8,})@'''
secretGroup = 1
entropy = 3.0
keywords = ["postgres"]
