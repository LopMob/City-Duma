---
# ЛР7: приведение сервера «Городской Думы» к требуемому состоянию.
#
#   make infra-apply ENV=staging       # или ENV=production
#
# Порядок ролей важен:
#   base     — пакеты, администратор, SSH (без root и паролей);
#   docker   — Docker Engine и Compose из официального репозитория;
#   firewall — iptables: открыты только нужные порты (после Docker, так как
#              использует его цепочку DOCKER-USER);
#   app      — пользователь deploy, каталоги, настройки, запуск и проверка.
- name: Подготовить сервер приложения
  hosts: all
  become: true
  # Факты собираются ниже, после проверки параметров запуска.
  gather_facts: false

  pre_tasks:
    - name: Проверить параметры запуска (адрес сервера и registry)
      ansible.builtin.assert:
        that:
          - ansible_host | length > 0
          - ansible_user | length > 0
          - app_image_repo is search('^[^/]+/.+')
        fail_msg: >-
          Укажите сервер и registry: make infra-apply ENV={{ env_name }}
          HOST=<IP сервера> SSH_USER=<пользователь>
          REGISTRY_IMAGE=<адрес registry>/<группа>/city-duma
        quiet: true

    # Без sudo: так в окружении видно SSH_CLIENT — адрес машины управления.
    - name: Собрать сведения о сервере
      ansible.builtin.setup:
      become: false

    - name: Запомнить адрес машины, откуда запущен Ansible
      ansible.builtin.set_fact:
        control_node_ip: "{{ (ansible_facts['env']['SSH_CLIENT'] | default('')).split() | first | default('') }}"

    - name: Проверить, что секреты окружения заданы (vault.yml)
      ansible.builtin.assert:
        that:
          - vault_postgres_password is defined
          - vault_postgres_password | length >= 12
        fail_msg: >-
          Нет секретов окружения {{ env_name }}. Создайте зашифрованный файл:
          make infra-vault ENV={{ env_name }} (образец — vault.yml.example).
        quiet: true

    - name: Проверить, что ОС из семейства Debian
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: Роли рассчитаны на Debian/Ubuntu.
        quiet: true

  roles:
    - role: base
      tags: [base]
    - role: docker
      tags: [docker]
    - role: firewall
      tags: [firewall]
    - role: app
      tags: [app]
