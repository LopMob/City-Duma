---
# Правила лежат в скрипте /usr/local/sbin/city-duma-firewall: его создаёт
# шаблон, а запускает systemd при загрузке. Скрипт меняет только свои
# цепочки CITY-DUMA-*, правила Docker не трогает.
- name: Создать скрипт правил iptables
  ansible.builtin.template:
    src: city-duma-firewall.sh.j2
    dest: /usr/local/sbin/city-duma-firewall
    owner: root
    group: root
    mode: "0750"
  register: firewall_script

- name: Создать службу, применяющую правила при загрузке
  ansible.builtin.template:
    src: city-duma-firewall.service.j2
    dest: /etc/systemd/system/city-duma-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: firewall_unit

- name: Включить службу правил при загрузке
  ansible.builtin.systemd:
    name: city-duma-firewall
    enabled: true
    daemon_reload: "{{ firewall_unit is changed }}"
  # В режиме --check новой службы ещё нет на диске — включать нечего.
  when: not ansible_check_mode or firewall_unit is not changed

# Только чтение: совпадают ли действующие правила с применёнными.
# Так находится ручная правка (iptables -D/-A), и следующий шаг её откатывает.
- name: Проверить, не меняли ли правила вручную
  ansible.builtin.command:
    cmd: /usr/local/sbin/city-duma-firewall check
  register: firewall_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Решить, нужно ли применять правила
  ansible.builtin.set_fact:
    firewall_apply_needed: "{{ firewall_script is changed or firewall_unit is changed or firewall_check.rc != 0 }}"

- name: Применить правила iptables
  ansible.builtin.command:
    cmd: /usr/local/sbin/city-duma-firewall apply
  when: firewall_apply_needed
  changed_when: true
