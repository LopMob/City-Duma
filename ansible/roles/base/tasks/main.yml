---
- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ base_packages + base_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Дать администратору право sudo
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
  register: base_admin

- name: Создать каталог .ssh администратора
  ansible.builtin.file:
    path: "{{ base_admin.home }}/.ssh"
    state: directory
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0700"

- name: Добавить ключи администраторов
  ansible.builtin.lineinfile:
    path: "{{ base_admin.home }}/.ssh/authorized_keys"
    line: "{{ base_key }}"
    create: true
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0600"
  loop: "{{ base_admin_ssh_public_keys }}"
  loop_control:
    loop_var: base_key
