---
- name: Установить базовые пакеты
  ansible.builtin.apt:
    name: "{{ base_packages + base_extra_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Дать администратору право sudo
  ansible.builtin.user:
    name: "{{ base_admin_user }}"
    groups: sudo
    append: true
  register: base_admin

- name: Создать каталог .ssh администратора
  ansible.builtin.file:
    path: "{{ base_admin.home }}/.ssh"
    state: directory
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0700"

- name: Добавить ключи администраторов
  ansible.builtin.lineinfile:
    path: "{{ base_admin.home }}/.ssh/authorized_keys"
    line: "{{ base_key }}"
    create: true
    owner: "{{ base_admin_user }}"
    group: "{{ base_admin_user }}"
    mode: "0600"
  loop: "{{ base_admin_ssh_public_keys }}"
  loop_control:
    loop_var: base_key

- name: Подключить каталог sshd_config.d (в Debian уже подключён)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    mode: "0644"
  notify: Перезагрузить SSH

- name: Настроить SSH (без root и паролей)
  ansible.builtin.template:
    src: sshd.conf.j2
    dest: /etc/ssh/sshd_config.d/10-city-duma.conf
    owner: root
    group: root
    mode: "0644"
    # Ошибка в настройке не должна отрезать доступ к серверу.
    validate: /usr/sbin/sshd -t -f %s
  notify: Перезагрузить SSH

- name: Включить SSH при загрузке
  ansible.builtin.service:
    name: ssh
    enabled: true
    state: started

- name: Создать каталог окружений /srv
  ansible.builtin.file:
    path: /srv
    state: directory
    owner: root
    group: root
    mode: "0755"
