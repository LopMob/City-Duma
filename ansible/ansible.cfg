# ЛР7: настройки Ansible для проекта. Команды запускаются из каталога ansible/
# (это делают цели make infra-*), поэтому пути ниже — относительно него.
[defaults]
# Окружение по умолчанию — staging; production выбирается явно: ENV=production.
inventory = inventories/staging/hosts.yml
roles_path = roles
# Отпечатки серверов проверяются: подключиться к подменённому узлу нельзя.
host_key_checking = True
# Не создавать *.retry рядом с плейбуком.
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
# Pipelining ускоряет запуск и нужен для become_user: deploy
# (временные файлы модулей не пишутся на диск сервера).
pipelining = True
